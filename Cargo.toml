[package]
name = "phototrace-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded read-only reconciliation of explicitly supplied media manifests"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
